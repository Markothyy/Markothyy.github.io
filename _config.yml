# Site settings
title: "Mark Sedek"
description: "Mechanical engineering student at Vanderbilt University. Test equipment, tooling, and flight hardware."
url: "https://markothyy.github.io"
baseurl: ""
locale: "en-US"

# Contact
email: "markabdo100@gmail.com"
linkedin: "https://www.linkedin.com/in/marksed"
github: "https://github.com/Markothyy"
resume: "/assets/files/Mark_Sedek_Resume.pdf"

# Build
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
plugins: []

collections:
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: portfolio
    values:
      layout: project

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
